<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>謙恩的學習系統</title>
<style>
  body{margin:0; font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
       background:#f7f4ee; color:#3b3a36; min-height:100vh; display:flex; align-items:flex-start; justify-content:center;}
  .box{max-width:440px; width:100%; padding:28px 22px; text-align:center;}
  h1{font-size:26px; margin:0 0 4px;}
  .sub{color:#8a867c; font-size:14px; margin-bottom:20px;}
  .wallet{background:#fff; border-radius:18px; padding:18px 16px; margin-bottom:18px;
          box-shadow:0 2px 10px rgba(0,0,0,.07); text-align:center;}
  .wallet .label{font-size:13px; color:#8a867c;}
  .wallet .amt{font-size:40px; font-weight:bold; color:#4c9a6f; margin:2px 0 6px;}
  .wallet .today{font-size:14px; color:#6b6862; line-height:1.7;}
  .wallet .today b{color:#c99a3c;}
  .wallet .status{font-size:12px; color:#b6b1a5; margin-top:6px;}
  a.mod{display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;
        background:#fff; border-radius:18px; padding:20px; margin-bottom:14px;
        box-shadow:0 2px 10px rgba(0,0,0,.07); font-size:22px; font-weight:bold;}
  a.mod:active{transform:scale(.98);}
  a.mod .emoji{font-size:34px;}
  a.mod small{display:block; font-size:13px; color:#8a867c; font-weight:normal; margin-top:4px; text-align:left;}
  footer{margin-top:20px; color:#b6b1a5; font-size:12px;}
</style>
</head>
<body>
  <div class="box">
    <h1>謙恩的學習系統</h1>
    <div class="sub">選一個科目開始今天的練習</div>

    <div class="wallet">
      <div class="label">💰 零用金錢包（可提領）</div>
      <div class="amt" id="balance">…</div>
      <div class="today" id="today">讀取中…</div>
      <div class="status" id="status"></div>
    </div>

    <a class="mod" href="v2/"><span class="emoji">🔤</span><span>英文<small>單字卡・測驗・閱讀</small></span></a>
    <a class="mod" href="chinese/"><span class="emoji">📖</span><span>國文<small>形音義・相似字・詞語（試玩中）</small></span></a>
    <a class="mod" href="reading/"><span class="emoji">📚</span><span>英語閱讀<small>點字讀故事・挑戰拿點數（純閱讀，不算錢）</small></span></a>
    <footer>TeenageStudyTool</footer>
  </div>

<script type="module">
// 錢包真相來源＝Google Sheet（與英文 v2 同一個 Apps Script API，唯讀）
// v2.48：算法改用共用的 v2/js/wallet.js（錢包綁人、上限／費率由家長頁設定）。
//   先顯示上次成功同步的快照（標「更新中」），背景拿到新資料再覆蓋——Apps Script 要 2–3 秒。
//   ⚠️ 快照只給畫面顯示，不拿來算錢（見 wallet.js saveSnapshot 的說明）。
import { computeWallet, saveSnapshot, loadSnapshot } from './v2/js/wallet.js?v=2.48';
const LOG_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbw1-aQQF4goCDF6X7_oIHEk4rVIbRrDADkq5ZQ1kopePXVehu9EGkkCNnj3Z4Hxd1aW7w/exec";
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const B=document.getElementById('balance'), T=document.getElementById('today'), S=document.getElementById('status');
function show(w, t){
  const today = w.day === undefined || w.day === t ? w.today : { en:{pre:0,fin:0}, cn:{pre:0,fin:0} };
  const cfg=w.cfg, capAll=Number(cfg['cap.all'])||0;
  B.textContent=`$${w.available}`;
  T.innerHTML=`今天：英文 <b>$${today.en.fin}</b>（上限 ${cfg['cap.en']}）　＋　國文 <b>$${today.cn.fin}</b>（上限 ${cfg['cap.cn']}）`
    + `<br>${capAll>0 ? `全科一天最多 $${capAll}` : `兩科都完成，一天最多 $${cfg['cap.en']+cfg['cap.cn']}`}（連勝加成另外算）`;
}
async function loadWallet(){
  const t=todayStr();
  const snap=loadSnapshot();
  if(snap && snap.cfg){ show(snap, t); S.textContent='更新中…（先顯示上次的數字）'; }
  try{
    const res=await fetch(`${LOG_WEBAPP_URL}?action=v2_events`,{mode:'cors',cache:'no-cache'});
    const data=await res.json();
    if(!data||!data.ok||!Array.isArray(data.events)) throw new Error('API 未就緒');
    const w=computeWallet(data.events, t);
    show(w, t);
    saveSnapshot(w, t);
    S.textContent=`資料來源：Google Sheet（${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})} 更新）`;
  }catch(e){
    if(snap && snap.cfg){ S.textContent='現在連不上錢包，上面是上次的數字'; return; }
    B.textContent='—';
    T.textContent='現在連不上錢包資料，先開始練習也沒關係！';
    S.textContent='（連上網路後重新整理即可）';
  }
}
loadWallet();
</script>
</body>
</html>
