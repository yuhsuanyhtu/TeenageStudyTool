<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>謙恩的英文閱讀角 📚</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:#FBF7EF; color:#3A3226; min-height:100vh;
  }
  .wrap { max-width:640px; margin:0 auto; padding:20px 18px 140px; }

  /* ---------- Home ---------- */
  .home-title { font-size:26px; font-weight:800; margin:8px 0 4px; }
  .home-sub { color:#8A7D66; font-size:15px; margin-bottom:22px; line-height:1.6; }
  .cat-label { font-size:14px; font-weight:700; color:#A08C5B; letter-spacing:2px; margin:20px 0 10px; }
  .card {
    background:#fff; border:1px solid #EFE6D5; border-radius:16px;
    padding:16px 18px; margin-bottom:12px; cursor:pointer;
    box-shadow:0 1px 3px rgba(90,70,30,.06); transition:transform .08s;
  }
  .card:active { transform:scale(.985); }
  .card .en { font-size:18px; font-weight:700; font-family:Georgia,serif; }
  .card .zh { font-size:14px; color:#8A7D66; margin-top:3px; }
  .card .meta { font-size:12px; color:#B7A98C; margin-top:6px; }
  .card .done-mark { float:right; font-size:14px; color:#7BA05B; }

  /* ---------- Reading ---------- */
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .btn-back {
    background:#fff; border:1px solid #EFE6D5; border-radius:12px;
    padding:8px 14px; font-size:15px; cursor:pointer; color:#3A3226;
  }
  .btn-listen {
    background:#F3EBDD; border:1px solid #E5D8BF; border-radius:12px;
    padding:8px 14px; font-size:15px; cursor:pointer; color:#6B5B3E; margin-left:auto;
  }
  .art-title { font-family:Georgia,serif; font-size:24px; font-weight:800; margin:6px 0 2px; }
  .art-zh { color:#8A7D66; font-size:14px; margin-bottom:16px; }
  .art-body {
    font-family:Georgia,"Times New Roman",serif;
    font-size:20px; line-height:2.0; letter-spacing:.2px;
  }
  .art-body p { margin-bottom:14px; }
  .w { cursor:pointer; border-radius:4px; padding:0 1px; }
  .w:active { background:#F5E9C8; }
  .w.seen { background:linear-gradient(transparent 70%, #F6E7B2 70%); }
  .w.current { background:#F1E3AF; }
  .art-footer { margin-top:26px; text-align:center; }
  .btn-finish {
    background:#EAF2E0; border:1px solid #CBDDB6; color:#4F6B35;
    border-radius:14px; padding:12px 22px; font-size:16px; cursor:pointer;
  }
  .finish-msg { margin-top:14px; font-size:15px; color:#4F6B35; line-height:1.8; display:none; }
  .attribution { margin-top:30px; font-size:11px; color:#C4B899; line-height:1.6; }

  /* ---------- Gloss sheet ---------- */
  #sheet {
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:#FFFDF7; border-top:1px solid #EBDFC8;
    box-shadow:0 -4px 20px rgba(90,70,30,.10);
    padding:14px 20px 20px; display:none;
  }
  #sheet .inner { max-width:640px; margin:0 auto; }
  #sheet .word { font-family:Georgia,serif; font-size:24px; font-weight:800; }
  #sheet .pos {
    display:inline-block; font-size:11px; background:#F3EBDD; color:#8A7355;
    border-radius:6px; padding:2px 7px; margin-left:8px; vertical-align:middle;
  }
  #sheet .gloss { font-size:18px; margin-top:6px; color:#3A3226; }
  #sheet .row { display:flex; align-items:center; gap:10px; margin-top:10px; }
  #sheet button {
    background:#F3EBDD; border:1px solid #E5D8BF; border-radius:10px;
    padding:7px 13px; font-size:14px; cursor:pointer; color:#6B5B3E;
  }
  #sheet .close { margin-left:auto; background:#fff; }
  .hint-badge { font-size:12px; color:#B7A98C; margin-top:8px; }

  /* ---------- Points pocket ---------- */
  .pocket {
    background:#FFF8E6; border:1px solid #F0E2BE; border-radius:14px;
    padding:12px 16px; margin-bottom:18px; font-size:15px; color:#7A6633;
  }
  .pocket .pocket-note { display:block; font-size:12px; color:#B7A98C; margin-top:4px; line-height:1.6; }

  /* ---------- Quiz ---------- */
  .quiz-q { font-size:19px; font-weight:700; margin:18px 0 16px; line-height:1.7; }
  .quiz-opt {
    display:block; width:100%; text-align:left;
    background:#fff; border:1px solid #EFE6D5; border-radius:14px;
    padding:14px 16px; margin-bottom:10px; font-size:16px; cursor:pointer; color:#3A3226;
  }
  .quiz-opt:active { transform:scale(.985); }
  .quiz-opt.opt-right { background:#EAF2E0; border-color:#9DBB7E; }
  .quiz-opt.opt-picked { background:#FFF4D6; border-color:#E5CE8F; }
  .quiz-fb { font-size:15px; color:#4F6B35; margin-top:6px; min-height:24px; line-height:1.7; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div id="sheet">
  <div class="inner">
    <span class="word" id="sh-word"></span><span class="pos" id="sh-pos"></span>
    <div class="gloss" id="sh-gloss"></div>
    <div class="row">
      <button onclick="speakWord()">🔊 再聽一次</button>
      <button class="close" onclick="closeSheet()">收起</button>
    </div>
  </div>
</div>

  text:`Your heart is a pump. It is about the size of your fist. It sits in your chest, a little to the left.

Then the Sun came out and shone gently. The man felt warm. He smiled, and he took off his coat by himself.
Sometimes, being gentle works better than being strong.`},
 {id:'dragon', cat:'story', emoji:'🐉', en:'The Dragon Who Could Not Fly', zh:'不會飛的龍', src:'原創故事（謙恩專用）',
  text:`Kiko was a young dragon with a big problem: he could not fly. Every morning, he climbed a hill, jumped, and fell into the grass. The other dragons laughed at him.
One night, Kiko met an old owl. "Why are you sad?" asked the owl. "My wings do not work," said Kiko.
The owl looked at his wings. "Your wings are fine. But you jump with your eyes closed, because you are afraid of falling. Tomorrow, keep your eyes open, and look at the sky, not the ground."
The next morning, Kiko jumped and looked only at the clouds. His wings caught the wind. He was flying! The wind was cold and wonderful.
Falling was never the problem. Being afraid to look up was.`}

/* ================= Google Sheet 紀錄（與英文/國文同端點）=================
   事件命名規則（重要，勿改）：
   - v2_ 開頭 → API 撈得到
   - 不以 _done 結尾 → 不會被英文錢包/日上限/連勝重算誤計（sync.js recomputeFromEvents）
   - 不是 v2_cn_*_paid → 不會被國文錢包誤計
   - 首頁錢包只認 _done 與 v2_cn_*_paid → 閱讀點數永遠不會變成錢
   事件：
   - v2_read_finish：讀完一篇（unit=文章id）→ ✓ 與上次閱讀日期的真相來源
   - v2_read_quiz：挑戰結果（quizSize=3, correct=答對數, amount=得到點數；重玩 amount=0）
   - v2_read_pagehide：閱讀中離開（觀察逃離熱點用，與英文慣例一致）
   點數口袋＝所有裝置 v2_read_quiz 的 amount 加總（以人計，不綁裝置）。 */
const PAY_URL="https://script.google.com/macros/s/AKfycbw1-aQQF4goCDF6X7_oIHEk4rVIbRrDADkq5ZQ1kopePXVehu9EGkkCNnj3Z4Hxd1aW7w/exec";
function rdDevice(){
  try{
    let n=localStorage.getItem('sv2.deviceName');
    if(!n){const ua=navigator.userAgent||'';let k='裝置';
      if(/iPad/i.test(ua))k='iPad';else if(/iPhone/i.test(ua))k='iPhone';
      else if(/Android/i.test(ua))k='Android';else if(/Macintosh/i.test(ua))k='Mac';else if(/Windows/i.test(ua))k='Windows';
      n=k+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
      localStorage.setItem('sv2.deviceName',n);}
    return n;
  }catch(e){return '(未命名)';}
}
function rdPost(ev, useBeacon){
  try{
    const body=JSON.stringify({event:ev.event,unit:ev.unit||'',quizSize:ev.quizSize??'',correct:ev.correct??'',
      prediction:'',amount:ev.amount??'',note:ev.note||'',money:'',totalPaid:'',streak:'',user:rdDevice()});
    if(useBeacon && navigator.sendBeacon){
      navigator.sendBeacon(PAY_URL, new Blob([body],{type:'text/plain;charset=utf-8'})); return;
    }
    fetch(PAY_URL,{method:'POST',mode:'no-cors',keepalive:true,
      headers:{'Content-Type':'text/plain;charset=utf-8'},body}).catch(()=>{});
  }catch(e){}
}
async function rdFetchState(){
  // 從 Sheet 重算：每篇 ✓/最後閱讀日、點數口袋、已挑戰過的文章（以人計＝全裝置）
  const res=await fetch(`${PAY_URL}?action=v2_events`,{mode:'cors',cache:'no-cache'});
  const data=await res.json();
  if(!data||!data.ok||!Array.isArray(data.events)) throw new Error('API');
  const lastRead={}, quizzed={}; let points=0;
  for(const ev of data.events){
    const name=String(ev.event||''); const unit=String(ev.unit||'');
    const date=String(ev.timestamp||'').slice(0,10);
    if(name==='v2_read_finish' && unit){
      if(!lastRead[unit]||date>lastRead[unit]) lastRead[unit]=date;
    }else if(name==='v2_read_quiz' && unit){
      points+=Number(ev.amount)||0;
      quizzed[unit]=true;
    }
  }
  return {lastRead, quizzed, points};
}

/* ================= 狀態（記憶體內，真相來源＝Sheet）================= */
let state = { view:'home', artId:null, seen:{}, finished:{} };
let sheetState = { lastRead:{}, quizzed:{}, points:null, online:false };
async function refreshSheetState(){
  try{ const s=await rdFetchState(); sheetState={...s, online:true}; }
  catch(e){ sheetState.online=false; }
}

/* ================= 畫面 ================= */
const app = document.getElementById('app');

function renderHome(){
  closeSheet(); stopSpeech();
  state.view='home'; state.artId=null;
  const sci = ARTICLES.filter(a=>a.cat==='sci');
  const story = ARTICLES.filter(a=>a.cat==='story');
  const card = a=>{
    const last = sheetState.lastRead[a.id];
    const mark = last ? `<span class="done-mark">✅ ${last}</span>` : (state.finished[a.id]?'<span class="done-mark">✅ 今天</span>':'');
    return `
    <div class="card" onclick="openArticle('${a.id}')">
      ${mark}
      <div class="en">${a.emoji} ${a.en}</div>
      <div class="zh">${a.zh}</div>
      <div class="meta">${a.text.split(/\s+/).length} 個字 · 約 ${Math.max(1,Math.round(a.text.split(/\s+/).length/60))} 分鐘${QUIZ[a.id]?(sheetState.quizzed[a.id]?' · 🎯 挑戰過':''):''}</div>
    </div>`;
  };
  const pts = sheetState.points===null ? '…' : sheetState.points;
  app.innerHTML = `
    <div class="home-title">謙恩的英文閱讀角 📚</div>
    <div class="home-sub">看不懂的字，<b>用手指點一下</b>，中文就會出現，還會唸給你聽。<br>這裡的閱讀不算錢——想讀什麼就讀什麼。</div>
    <div class="pocket">🎒 閱讀點數：<b id="pocket-pts">${pts}</b> 點
      <span class="pocket-note">讀完文章後可以自選挑戰，答對拿點數（點數不是錢，是閱讀角自己的寶物）</span></div>
    <div class="cat-label">🧬 身體與科學</div>
    ${sci.map(card).join('')}
    <div class="cat-label">🐉 故事與奇幻</div>
    ${story.map(card).join('')}
    <div class="attribution">寓言改寫自伊索寓言（公共財）。科普與龍的故事為原創。<br>想要更多文章的話，跟爸爸說一聲！<br><a href="../" style="color:#B7A98C">← 回學習系統首頁</a></div>`;
  window.scrollTo(0,0);
}

function tokenizeToHtml(text, artId){
  return text.split(/\n/).map(par=>{
    const html = par.replace(/[A-Za-z]+/g, m=>{
      const key = m.toLowerCase();
      const seenCls = state.seen[artId] && state.seen[artId][key] ? ' seen' : '';
      return `<span class="w${seenCls}" data-w="${key}" onclick="tapWord(this)">${m}</span>`;
    });
    return `<p>${html}</p>`;
  }).join('');
}

function openArticle(id){
  const a = ARTICLES.find(x=>x.id===id);
  state.view='read'; state.artId=id;
  if(!state.seen[id]) state.seen[id]={};
  app.innerHTML = `
    <div class="topbar">
      <button class="btn-back" onclick="renderHome()">← 回書架</button>
      <button class="btn-listen" id="btn-listen" onclick="toggleReadAloud()">🔊 聽整篇</button>
    </div>
    <div class="art-title">${a.emoji} ${a.en}</div>
    <div class="art-zh">${a.zh} · ${a.src}</div>
    <div class="art-body">${tokenizeToHtml(a.text, id)}</div>
    <div class="art-footer">
      <button class="btn-finish" onclick="finishArticle()">我讀完了 🌟</button>
      <div class="finish-msg" id="finish-msg"></div>
    </div>
    <div class="hint-badge">小提醒：點任何一個字都可以，點過的字會有黃色底線。</div>`;
  window.scrollTo(0,0);
}

/* ================= 點字查詢 ================= */
let currentWord = null, currentEl = null;

function tapWord(el){
  const key = el.dataset.w;
  if(currentEl) currentEl.classList.remove('current');
  currentEl = el; el.classList.add('current');
  el.classList.add('seen');
  if(state.artId) state.seen[state.artId][key] = true;
  // 同一個字全部標記
  document.querySelectorAll(`.w[data-w="${key}"]`).forEach(x=>x.classList.add('seen'));

  currentWord = key;
  const entry = DICT[key];
  document.getElementById('sh-word').textContent = key;
  if(entry){
    document.getElementById('sh-pos').textContent = entry[1];
    document.getElementById('sh-pos').style.display='inline-block';
    document.getElementById('sh-gloss').textContent = entry[0];
  }else{
    document.getElementById('sh-pos').style.display='none';
    document.getElementById('sh-gloss').textContent = '這個字先聽聽發音，記住它的樣子 🌱';
  }
  document.getElementById('sheet').style.display='block';
  speakWord();
}

/* v2.39.1：自動挑裝置上最好的英文語音。
   macOS/iOS 下載 Premium / Enhanced 語音後（設定→輔助使用→朗讀內容→管理聲音），
   重開瀏覽器就會自動被選中，不用任何設定。Siri 語音瀏覽器拿不到（Apple 限制），不列入。 */
let bestVoice = null, voicesReady = false;
function pickBestVoice(){
  try{
    const vs = speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
    if(!vs.length) return null;
    const score = v=>{
      const n = v.name.toLowerCase();
      if(n.includes('premium')) return 5;
      if(n.includes('enhanced')) return 4;
      if(/ava|zoe|evan|joelle/.test(n)) return 3;          // 高品質語音常見名（未標 Premium 時）
      if(n.includes('google') && v.lang==='en-US') return 2; // Chrome 的 Google 網路語音也不錯
      if(n.includes('samantha')) return 1;
      return 0;
    };
    return vs.sort((a,b)=>score(b)-score(a))[0];
  }catch(e){ return null; }
}
function refreshVoice(){ bestVoice = pickBestVoice(); voicesReady = true; }
if('speechSynthesis' in window){
  refreshVoice();
  speechSynthesis.onvoiceschanged = refreshVoice;  // 語音清單常是非同步載入
}
function makeUtter(text, rate){
  const u = new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=rate;
  if(!voicesReady) refreshVoice();
  if(bestVoice) u.voice = bestVoice;
  return u;
}

function speakWord(){
  if(!currentWord) return;
  stopSpeech();
  speechSynthesis.speak(makeUtter(currentWord, 0.8));
}

function closeSheet(){
  document.getElementById('sheet').style.display='none';
  if(currentEl){ currentEl.classList.remove('current'); currentEl=null; }
}

/* ================= 整篇朗讀 ================= */
let readingAloud = false;
function toggleReadAloud(){
  const btn = document.getElementById('btn-listen');
  if(readingAloud){ stopSpeech(); readingAloud=false; btn.textContent='🔊 聽整篇'; return; }
  const a = ARTICLES.find(x=>x.id===state.artId);
  stopSpeech();
  const u = makeUtter(a.text.replace(/\n/g,' '), 0.85);
  u.onend = ()=>{ readingAloud=false; const b=document.getElementById('btn-listen'); if(b) b.textContent='🔊 聽整篇'; };
  readingAloud = true; btn.textContent='⏹ 停止';
  speechSynthesis.speak(u);
}
function stopSpeech(){ try{ speechSynthesis.cancel(); }catch(e){} }

/* ================= 讀完 → ✓ 紀錄 → 自選挑戰 ================= */
function finishArticle(){
  const a = ARTICLES.find(x=>x.id===state.artId);
  const firstFinishToday = !state.finished[state.artId];
  state.finished[state.artId]=true;
  if(firstFinishToday){
    rdPost({event:'v2_read_finish', unit:a.id, note:a.en});
    sheetState.lastRead[a.id]=todayStr();
  }
  const n = Object.keys(state.seen[state.artId]||{}).length;
  const msg = document.getElementById('finish-msg');
  msg.style.display='block';
  const already = sheetState.quizzed[a.id];
  const quizBtns = QUIZ[a.id] ? `
    <div style="margin-top:12px">
      <button class="btn-finish" onclick="startQuiz()">${already?'🎯 再玩一次挑戰（不加點）':'🎯 要不要挑戰 3 題？答對 1 題拿 1 點'}</button>
      <button class="btn-back" style="margin-left:8px" onclick="renderHome()">下次再說</button>
    </div>` : '';
  msg.innerHTML = (n>0
    ? `太棒了！你讀完了一篇英文文章 🎉<br>今天認識了 <b>${n}</b> 個單字新朋友 🌱`
    : `太棒了！你讀完了一篇英文文章 🎉<br>整篇都看得懂，太厲害了！`) + quizBtns;
  msg.scrollIntoView({behavior:'smooth', block:'center'});
}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

/* ================= 自選挑戰（答錯不扣、不羞辱）================= */
let quiz = null;
function startQuiz(){
  closeSheet(); stopSpeech();
  const artId = state.artId;
  const replay = !!sheetState.quizzed[artId];
  quiz = { artId, i:0, got:0, replay };
  renderQuizQ();
}
function renderQuizQ(){
  const a = ARTICLES.find(x=>x.id===quiz.artId);
  const item = QUIZ[quiz.artId][quiz.i];
  const opts = shuffleArr([item.a, ...item.o]);
  app.innerHTML = `
    <div class="topbar"><button class="btn-back" onclick="openArticle('${quiz.artId}')">← 回文章</button></div>
    <div class="art-title">🎯 挑戰 ${quiz.i+1}／${QUIZ[quiz.artId].length}</div>
    <div class="art-zh">${a.emoji} ${a.en}${quiz.replay?' · 再玩一次（不加點）':''}</div>
    <div class="quiz-q">${item.q}</div>
    <div id="quiz-opts">${opts.map(o=>`<button class="quiz-opt" onclick="answerQuiz(this)" data-ok="${o===item.a?1:0}">${o}</button>`).join('')}</div>
    <div class="quiz-fb" id="quiz-fb"></div>`;
  window.scrollTo(0,0);
}
function answerQuiz(btn){
  if(quiz.answered) return;
  quiz.answered = true;
  const ok = btn.dataset.ok==='1';
  const fb = document.getElementById('quiz-fb');
  document.querySelectorAll('.quiz-opt').forEach(b=>{
    b.style.pointerEvents='none';
    if(b.dataset.ok==='1') b.classList.add('opt-right');
  });
  if(ok){ quiz.got++; fb.innerHTML = quiz.replay?'答對了！✨':'答對了！<b>+1 點</b> ✨'; }
  else { btn.classList.add('opt-picked'); fb.innerHTML='答案是綠色的那個 🌱 沒關係，看一眼記起來就好'; }
  setTimeout(()=>{
    quiz.answered=false; quiz.i++;
    if(quiz.i < QUIZ[quiz.artId].length) renderQuizQ();
    else endQuiz();
  }, 1600);
}
function endQuiz(){
  const gotPts = quiz.replay ? 0 : quiz.got;
  rdPost({event:'v2_read_quiz', unit:quiz.artId, quizSize:QUIZ[quiz.artId].length, correct:quiz.got,
          amount:gotPts, note:quiz.replay?'replay':'points'});
  if(!quiz.replay){
    sheetState.quizzed[quiz.artId]=true;
    if(sheetState.points!==null) sheetState.points+=gotPts;
  }
  const a = ARTICLES.find(x=>x.id===quiz.artId);
  app.innerHTML = `
    <div class="art-title" style="text-align:center;margin-top:40px">🎉 挑戰完成！</div>
    <div style="text-align:center;font-size:17px;line-height:2;margin-top:10px">
      ${a.emoji} ${a.en}<br>
      答對 <b>${quiz.got}</b>／${QUIZ[quiz.artId].length} 題
      ${quiz.replay?'（再玩模式，不加點）':`，拿到 <b>${gotPts}</b> 點！`}<br>
      ${sheetState.points!==null&&!quiz.replay?`🎒 口袋現在有 <b>${sheetState.points}</b> 點`:''}
    </div>
    <div style="text-align:center;margin-top:24px">
      <button class="btn-finish" onclick="renderHome()">回書架 📚</button>
    </div>`;
}
function shuffleArr(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= 逃離觀察（與英文 pagehide 慣例一致）================= */
window.addEventListener('pagehide', ()=>{
  if(state.view==='read' && state.artId && !state.finished[state.artId]){
    rdPost({event:'v2_read_pagehide', unit:state.artId, note:'mid-read'}, true);
  }
});

/* ================= 啟動 ================= */
renderHome();
refreshSheetState().then(()=>{ if(state.view==='home') renderHome(); });
</script>
