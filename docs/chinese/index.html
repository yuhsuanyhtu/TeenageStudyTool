<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>謙恩的國文練習</title>
<style>
  :root{
    --bg:#f7f4ee; --card:#ffffff; --ink:#3b3a36; --sub:#8a867c;
    --green:#4c9a6f; --green-bg:#e8f4ed; --red:#c96f5f; --red-bg:#faeceb;
    --blue:#5b7fa6; --blue-bg:#eaf1f7; --amber:#c99a3c; --amber-bg:#faf3e3;
    --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh;}
  .wrap{max-width:640px; margin:0 auto; padding:20px 16px 60px;}
  header{text-align:center; padding:10px 0 4px;}
  header h1{font-size:22px; margin:0 0 4px;}
  header .sub{color:var(--sub); font-size:14px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px;}
  .grid button{
    font-size:16px; padding:14px 12px; border:none; border-radius:14px; text-align:left;
    background:var(--card); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.06); cursor:pointer;
  }
  .grid button b{display:block; font-size:18px;}
  .grid button small{color:var(--sub); font-size:12px;}
  .grid button:active{transform:scale(.97);}
  .widebtn{grid-column:1 / -1; background:var(--blue-bg) !important;}
  .menu{display:flex; flex-direction:column; gap:12px; margin-top:20px;}
  .menu button{
    font-size:19px; padding:18px; border:none; border-radius:var(--radius);
    background:var(--card); color:var(--ink); box-shadow:0 2px 8px rgba(0,0,0,.06);
    cursor:pointer; text-align:left; display:flex; align-items:center; gap:14px;
  }
  .menu button .emoji{font-size:26px;}
  .menu button small{display:block; color:var(--sub); font-size:13px; margin-top:2px; font-weight:normal;}
  .menu button:active{transform:scale(.98);}
  .scorenote{margin-top:16px; background:var(--amber-bg); border-radius:14px; padding:12px 14px; font-size:14px; color:#7a5c1e; line-height:1.7;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .topbar .back{background:none; border:none; font-size:15px; color:var(--blue); cursor:pointer; padding:6px;}
  .topbar .prog{font-size:14px; color:var(--sub);}
  .topbar .stars{font-size:14px; color:var(--amber); font-weight:bold;}
  .card{background:var(--card); border-radius:var(--radius); padding:22px 18px; box-shadow:0 2px 10px rgba(0,0,0,.06);}
  .qtext{font-size:24px; line-height:1.9; margin-bottom:18px; letter-spacing:1px;}
  .qtext .blank{display:inline-block; min-width:1.5em; border-bottom:3px solid var(--amber); text-align:center; color:var(--amber); font-weight:bold;}
  .opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(90px,1fr)); gap:12px;}
  .opts button{font-size:30px; padding:16px 8px; border:2px solid #e5e1d8; border-radius:14px; background:#fbfaf7; cursor:pointer; transition:all .15s;}
  .opts button:active{transform:scale(.96);}
  .opts button.right{background:var(--green-bg); border-color:var(--green); color:var(--green);}
  .opts button.wrong{background:var(--red-bg); border-color:var(--red); color:var(--red); animation:shake .3s;}
  .opts button.dim{opacity:.35; pointer-events:none;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .feedback{margin-top:16px; padding:14px; border-radius:14px; font-size:16px; line-height:1.7; display:none;}
  .feedback.show{display:block;}
  .feedback.good{background:var(--green-bg); color:#2f6b4c;}
  .feedback.info{background:var(--amber-bg); color:#7a5c1e;}
  .nextbtn{margin-top:16px; width:100%; font-size:18px; padding:14px; border:none; border-radius:14px; background:var(--blue); color:#fff; cursor:pointer; display:none;}
  .nextbtn.show{display:block;}
  .spot-sent{font-size:30px; line-height:2; letter-spacing:6px; text-align:center;}
  .spot-sent .ch{cursor:pointer; padding:4px 2px; border-radius:8px;}
  .spot-sent .ch:active{background:var(--blue-bg);}
  .spot-sent .ch.found{background:var(--red-bg); color:var(--red); text-decoration:line-through; font-weight:bold;}
  .spot-sent .ch.fixed{background:var(--green-bg); color:var(--green); font-weight:bold; text-decoration:none;}
  .spot-tip{color:var(--sub); font-size:14px; margin-bottom:10px;}
  .match-cols{display:flex; gap:12px;}
  .mcol{flex:1; display:flex; flex-direction:column; gap:10px;}
  .mcol button{font-size:17px; padding:12px 8px; border:2px solid #e5e1d8; border-radius:12px; background:#fbfaf7; cursor:pointer; line-height:1.5; min-height:56px;}
  .mcol button.charbtn{font-size:32px;}
  .mcol button.sel{border-color:var(--blue); background:var(--blue-bg);}
  .mcol button.done{background:var(--green-bg); border-color:var(--green); color:var(--green); pointer-events:none;}
  .mcol button.err{animation:shake .3s; border-color:var(--red); background:var(--red-bg);}
  .hinttable{margin-top:18px; font-size:15px; line-height:1.8; background:var(--amber-bg); border-radius:14px; padding:14px; display:none;}
  .hinttable.show{display:block;}
  .hinttable b{color:#7a5c1e;}
  .result{text-align:center; padding:30px 10px;}
  .result .big{font-size:46px; margin-bottom:10px;}
  .result h2{margin:6px 0; font-size:24px;}
  .result p{color:var(--sub); font-size:16px; line-height:1.8;}
  .result .starline{font-size:22px; color:var(--amber); margin:8px 0;}
  .zhu{font-size:13px; color:var(--sub);}
  .starearn{font-weight:bold; color:var(--amber);}
  .wordtable{width:100%; border-collapse:collapse; font-size:16px;}
  .wordtable td{padding:10px 6px; border-bottom:1px solid #efece4; vertical-align:top; line-height:1.6;}
  .wordtable .w{font-size:20px; font-weight:bold; white-space:nowrap;}
  .wordtable .z{color:var(--blue); font-size:13px; white-space:nowrap;}
  .wordtable .h{color:var(--sub); font-size:13px;}
  .readtext{font-size:20px; line-height:2.1; letter-spacing:1px;}
  .readtext h3{font-size:18px; color:var(--blue); margin:18px 0 6px;}
  .readtext p{margin:0 0 10px;}
  .readnote{color:var(--sub); font-size:13px; margin-top:14px; line-height:1.6;}
  .screen{display:none;}
  .screen.active{display:block;}
  footer{text-align:center; color:#b6b1a5; font-size:12px; margin-top:36px; line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">

  <div id="home" class="screen active">
    <header>
      <h1>📖 謙恩的國文練習</h1>
      <div class="sub">翰林 2上＋3上｜全部用「點」的，不用打字</div>
    </header>
    <div class="grid" id="lessonGrid"></div>
    <div class="scorenote">⭐ 計分：<b>一次就答對 ⭐⭐⭐</b>｜第二次 ⭐⭐｜第三次以上 ⭐（不倒扣，用猜的星星會變少）</div>
    <footer>生字範圍：翰林 2上／3上 各課習字練功坊（官方完整清單）<br>題目採固定詞組・成語・古典詩文（語言公共財）｜v0.5.1 2026-08-08</footer>
  </div>

  <div id="lesson" class="screen">
    <div class="topbar">
      <button class="back" onclick="show('home')">← 回課次</button>
      <span class="prog" id="ltitle"></span>
    </div>
    <div class="menu" id="lessonMenu"></div>
  </div>

  <div id="play" class="screen">
    <div class="topbar">
      <button class="back" onclick="backFromPlay()">← 返回</button>
      <span class="stars" id="starbar">⭐ 0</span>
      <span class="prog" id="prog"></span>
    </div>
    <div class="card" id="qcard"></div>
  </div>

</div>

<script>
/* ===== 資料：2上 L01–L10 =====
   生字清單＝各課「習字練功坊」官方完整字詞（L10 為閱讀課，取注釋重點詞）。
   題目一律為固定詞組／成語／古典詩文（語言公共財）。 */

 words:[

  {w:"震懾",z:"ㄓㄣˋ ㄓㄜˊ",b:"懾",o:["囁","躡"],h:"心部（忄）→ 心裡害怕"},
  {w:"滂沱",z:"ㄆㄤ ㄊㄨㄛˊ",b:"滂",o:["磅","徬"],h:"水部（氵）→ 跟雨水有關"},
  {w:"匍匐",z:"ㄆㄨˊ ㄈㄨˊ",b:"匐",o:["伏","服"],h:"匍匐＝勹部，伏地爬行"},
  {w:"霹靂",z:"ㄆㄧ ㄌㄧˋ",b:"霹",o:["劈","癖"],h:"雨部 → 打雷"},
  {w:"肆虐",z:"ㄙˋ ㄋㄩㄝˋ",b:"虐",o:["謔","瘧"],h:"虐＝殘害（謔＝言部開玩笑；瘧＝疒部瘧疾）"},
  {w:"咫尺",z:"ㄓˇ ㄔˇ",b:"咫",o:["只","指"],h:"咫＝古代長度單位，「近在咫尺」"},
  {w:"劈殺",z:"ㄆㄧ ㄕㄚ",b:"劈",o:["霹","噼"],h:"刀部 → 用刀砍"},
  {w:"霎時",z:"ㄕㄚˋ ㄕˊ",b:"霎",o:["煞","剎"],h:"雨部 → 一陣雨的時間＝極短"},
  {w:"蓑衣",z:"ㄙㄨㄛ ㄧ",b:"蓑",o:["衰","哀"],h:"艸部 → 草編的雨衣"},
  {w:"攫取",say:"決取",z:"ㄐㄩㄝˊ ㄑㄩˇ",b:"攫",o:["獲","矍"],h:"手部（扌）→ 用爪抓取"},
  {w:"滲水",z:"ㄕㄣˋ ㄕㄨㄟˇ",b:"滲",o:["摻","慘"],h:"水部 → 水透入（摻＝手部摻入；慘＝忄悲慘）"}],
 sets:[
  {label:"滂・徬・磅",chars:[
   {c:"滂",z:"ㄆㄤ",m:"滂沱：雨勢盛大的樣子",u:"大雨滂沱",h:"水部（氵）→ 跟「水、雨」有關"},

   {c:"磅",z:"ㄆㄤˊ",m:"磅礡：廣大無邊際",u:"氣勢磅礡",h:"石部 → 跟「石頭、厚重」有關"}]},

  {label:"懾・囁・躡・聶",chars:[
   {c:"懾",z:"ㄓㄜˊ",m:"害怕、恐懼",u:"震懾",h:"心部（忄）→ 跟「心裡感受」有關"},
   {c:"囁",z:"ㄋㄧㄝˋ",m:"囁嚅：想說又不敢說",u:"囁嚅難言",h:"口部 → 跟「說話」有關"},
   {c:"躡",z:"ㄋㄧㄝˋ",m:"放輕腳步行走",u:"躡手躡腳",h:"足部 → 跟「腳步」有關"},
   {c:"聶",z:"ㄋㄧㄝˋ",m:"姓氏",u:"聶小倩",h:"三個耳朵 → 當「姓氏」用"}]},
  {label:"鈞・均・勺・勻",chars:[
   {c:"鈞",z:"ㄐㄩㄣ",m:"古代重量單位（三十斤）",u:"千鈞一髮",h:"金部 → 跟「金屬、重量」有關"},
   {c:"均",z:"ㄐㄩㄣ",m:"等同、相等",u:"勢均力敵",h:"土部 → 把土整平＝「平均」"},
   {c:"勺",z:"ㄕㄠˊ",m:"舀水的器具",u:"勺子舀水",h:"象形字 → 像一支杓子"},
   {c:"勻",z:"ㄩㄣˊ",m:"平均的",u:"身材勻稱",h:"分得剛剛好 → 「均勻」"}]}],
 extra:[

  {t:"氣勢（＿）礡",a:"磅",o:["滂","徬","磅"],w:"氣勢磅礡",h:"石部 → 厚重盛大"},
  {t:"開天（＿）地",a:"闢",o:["霹","劈","癖","闢"],w:"開天闢地",h:"門部 → 開創"},

  {t:"晴天（＿）靂",a:"霹",o:["霹","劈","癖","闢"],w:"晴天霹靂",h:"雨部 → 打雷"},
  {t:"潔（＿）成性",a:"癖",o:["霹","劈","癖","闢"],w:"潔癖",h:"疒部 → 習性"},
  {t:"（＿）小倩（聊齋志異人物）",a:"聶",o:["懾","囁","躡","聶"],w:"聶（姓氏）",h:"三個耳朵 → 姓氏"},
  {t:"（＿）手（＿）腳",a:"躡",o:["懾","囁","躡","聶"],w:"躡手躡腳",h:"足部 → 腳步"},
  {t:"（＿）嚅難言",a:"囁",o:["懾","囁","躡","聶"],w:"囁嚅",h:"口部 → 說話吞吐"},
  {t:"千（＿）一髮",a:"鈞",o:["鈞","均","勻"],w:"千鈞一髮",h:"金部 → 重量單位"},

{id:"L02",title:"古詩選",author:"佚名／白居易",
 words:[
  {w:"迢迢",z:"ㄊㄧㄠˊ ㄊㄧㄠˊ",b:"迢",o:["沼","昭"],h:"辵部（辶）→ 路途遙遠（沼＝水池；昭＝明亮）"},
  {w:"啞啞",say:"訝訝",z:"ㄧㄚˋ ㄧㄚˋ",b:"啞",o:["鴉","亞"],h:"口部擬聲，烏鴉叫聲（這裡讀ㄧㄚˋ）"},
  {w:"星宿",say:"星秀",z:"ㄒㄧㄥ ㄒㄧㄡˋ",b:"宿",o:["秀","繡"],h:"「宿」當星座時讀ㄒㄧㄡˋ"},

  {w:"紛紜",z:"ㄈㄣ ㄩㄣˊ",b:"紜",o:["耘","云"],h:"糸部 → 眾說紛紜（耘＝耕耘）"},
  {w:"反哺",z:"ㄈㄢˇ ㄅㄨˇ",b:"哺",o:["捕","脯"],h:"口部 → 餵食；烏鴉反哺報答母恩"},

  {w:"簌簌",z:"ㄙㄨˋ ㄙㄨˋ",b:"簌",o:["嗽","漱"],h:"竹部 → 東西落下的聲音"}],
 text:{title:"課文（古典詩・公共財）",parts:[

  {h:"慈烏夜啼（白居易）",lines:["慈烏失其母，啞啞吐哀音。","晝夜不飛去，經年守故林。","夜夜夜半啼，聞者為沾襟。","聲中如告訴，未盡反哺心。","百鳥豈無母，爾獨哀怨深。","應是母慈重，使爾悲不任。","昔有吳起者，母歿喪不臨。","嗟哉斯徒輩，其心不如禽。","慈烏復慈烏，鳥中之曾參。"]}]}},
{id:"L03",title:"下雨天，真好",author:"琦君",

  {w:"熹微",z:"ㄒㄧ ㄨㄟˊ",b:"熹",o:["嬉","禧"],h:"下面四點是火 → 天剛亮的微光（嬉＝女部嬉戲）"},
  {w:"長凳",z:"ㄔㄤˊ ㄉㄥˋ",b:"凳",o:["瞪","蹬"],h:"几部 → 坐的凳子（瞪＝目、蹬＝足）"},

  {w:"吱嗒",z:"ㄓ ㄉㄚ",b:"嗒",o:["搭","踏"],h:"口部擬聲 → 聲音"},
  {w:"發霉",z:"ㄈㄚ ㄇㄟˊ",b:"霉",o:["梅","莓"],h:"雨部 → 潮溼發霉（梅＝木、莓＝艸）"},
  {w:"茶壺",z:"ㄔㄚˊ ㄏㄨˊ",b:"壺",o:["壼","湖"],h:"注意「壺」的寫法，別多一橫寫成「壼」"},
  {w:"揀麴",say:"簡渠",z:"ㄐㄧㄢˇ ㄑㄩˊ",b:"麴",o:["鞠","翹"],h:"麥部 → 釀酒用的酒麴"},

  {w:"黏答答",z:"ㄋㄧㄢˊ ㄉㄚ ㄉㄚ",b:"黏",o:["粘","沾"],h:"黍部 → 台灣標準用「黏」"},

  {h:"愛蓮說（宋・周敦頤）",lines:["水陸草木之花，可愛者甚蕃。晉陶淵明獨愛菊；自李唐來，世人盛愛牡丹；予獨愛蓮之出淤泥而不染，濯清漣而不妖，中通外直，不蔓不枝，香遠益清，亭亭淨植，可遠觀而不可褻玩焉。","予謂菊，花之隱逸者也；牡丹，花之富貴者也；蓮，花之君子者也。噫！菊之愛，陶後鮮有聞；蓮之愛，同予者何人？牡丹之愛，宜乎眾矣！"]}]}},

 text:{title:"課文（文言・公共財）",parts:[
  {h:"張釋之執法（《史記》節錄・司馬遷）",lines:["釋之為廷尉。上行，出中渭橋，有一人從橋下走出，乘輿馬驚。於是使騎捕，屬之廷尉。","釋之治問。曰：「縣人來，聞蹕，匿橋下。久之，以為行已過，即出，見乘輿車騎，即走耳。」廷尉奏當：一人犯蹕，當罰金。","文帝怒曰：「此人親驚吾馬，吾馬賴柔和，令他馬，固不敗傷我乎？而廷尉乃當之罰金！」","釋之曰：「法者，天子所與天下公共也。今法如此而更重之，是法不信於民也。且方其時，上使立誅之則已。今既下廷尉，廷尉，天下之平也，一傾而天下用法皆為輕重，民安所錯其手足？唯陛下察之。」","良久，上曰：「廷尉當是也。」"]}]}},

/* ===== 零用金（鏡射英文規則，事件記到同一張 Google Sheet） =====
   規則：基礎$10（單日首輪「一次答對」≥5）＋每題一次答對+$2；日上限$100（國文獨立）；
   連勝階梯 7/14/30 天 ×1.2/1.4/1.6（國文自己的連勝，跨裝置以「人」計）。
   只有⭐⭐⭐（一次答對）算錢；連連看/詞語配對＝複習不計酬。
   事件名 v2_cn_*_paid：v2_ 開頭（API 撈得到）、非 _done 結尾（不污染英文日上限）。 */
const PAY_URL="https://script.google.com/macros/s/AKfycbw1-aQQF4goCDF6X7_oIHEk4rVIbRrDADkq5ZQ1kopePXVehu9EGkkCNnj3Z4Hxd1aW7w/exec";
/* v2.39：國文日上限改為家長可分科設定（提領頁 ⚙️，事件 v2_config_daily_cap_cn，最後一筆生效）。
   CN_CAP 變成 let，cnFetchState() 每次結算前從 Sheet 讀最新值；沒設定＝預設 100。 */
let CN_CAP=100; const CN_BASE=10, CN_PER=2, CN_MIN=5;
const CN_TIERS=[[7,1.2],[14,1.4],[30,1.6]];
function cnToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function cnMul(st){let m=1;for(const[d,x]of CN_TIERS)if(st>=d)m=x;return m;}
function cnDevice(){
  try{
    let n=localStorage.getItem('sv2.deviceName');
    if(!n){const ua=navigator.userAgent||'';let k='裝置';
      if(/iPad/i.test(ua))k='iPad';else if(/iPhone/i.test(ua))k='iPhone';
      else if(/Android/i.test(ua))k='Android';else if(/Macintosh/i.test(ua))k='Mac';else if(/Windows/i.test(ua))k='Windows';
      n=k+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
      localStorage.setItem('sv2.deviceName',n);}
    return n;
  }catch(e){return '(未命名)';}
}
async function cnFetchState(){
  // 從 Sheet 重算國文今日已賺/基礎是否已給/連勝（以人計＝所有裝置）
  const res=await fetch(`${PAY_URL}?action=v2_events`,{mode:'cors',cache:'no-cache'});
  const data=await res.json();
  if(!data||!data.ok||!Array.isArray(data.events)) throw new Error('API');
  const t=cnToday(); let today=0, baseGiven=false; const days=new Set();
  for(const ev of data.events){
    const name=String(ev.event||'');
    if(name==='v2_config_daily_cap_cn'){                       // v2.39：家長設定的國文上限（最後一筆生效）
      const v=Math.floor(Number(ev.amount)||0);
      if(v>=10&&v<=1000) CN_CAP=v;
      continue;
    }
    if(!name.startsWith('v2_cn_')||!name.endsWith('_paid'))continue;
    const date=String(ev.timestamp||'').slice(0,10);
    const amt=Number(ev.amount)||0, ft=Number(ev.correct)||0;
    if(amt>0&&date===t)today+=amt;
    if(date===t&&String(ev.note||'').includes('base'))baseGiven=true;
    if(ft>=CN_MIN)days.add(date);
  }
  if(today>CN_CAP)today=CN_CAP;
  // streak：從今天往回連續打卡天數（今天沒完成則從昨天起算）
  let st=0; let d=new Date();
  const fmt=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
  if(!days.has(fmt(d)))d.setDate(d.getDate()-1);
  while(days.has(fmt(d))){st++;d.setDate(d.getDate()-1);}
  return {today,baseGiven,streak:st};
}
function cnCalc(ft,stx){
  // ft=一次答對題數；stx={today,baseGiven,streak}
  const base=(!stx.baseGiven&&ft>=CN_MIN)?CN_BASE:0;
  const per=ft*CN_PER;
  const raw=base+per;
  const remain=Math.max(0,CN_CAP-stx.today);
  const pre=Math.min(raw,remain);
  const mul=cnMul(stx.streak);
  const fin=Math.round(pre*mul);
  let txt;
  if(pre===0){ txt= ft>0?`國文今天已達 $${CN_CAP} 上限，明天再來！`:`這輪沒有一次答對的題目，沒有獎金（多練就有）`; }
  else{
    const b=base>0?`基礎 $${base}＋`:'';
    const m=mul>1?`×${mul.toFixed(1)}（連勝 ${stx.streak} 天）`:'';
    const capN=pre<raw?`（受日上限採計 $${pre}）`:'';
    txt=`${b}一次答對 ${ft} 題 +$${per}${capN}${m}＝$${fin}`;
  }
  return {fin,pre,base,txt};
}
function cnPost(ev){
  try{
    fetch(PAY_URL,{method:'POST',mode:'no-cors',keepalive:true,
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({event:ev.event,unit:ev.unit||'',quizSize:ev.quizSize??'',correct:ev.correct??'',
        prediction:'',amount:ev.amount??'',note:ev.note||'',money:'',totalPaid:'',streak:ev.streak??'',user:cnDevice()})
    }).catch(()=>{});
  }catch(e){}
}
async function cnSettle(modeName,unit,total){
  // 回傳結算 HTML；同時把事件寫進 Sheet
  try{
    const stx=await cnFetchState();
    const r=cnCalc(firstTry,stx);
    cnPost({event:`v2_cn_${modeName}_paid`,unit,quizSize:total,correct:firstTry,amount:r.fin,
            note:(r.base>0?'base;':'')+`stars=${stars}`,streak:stx.streak});
    const newToday=Math.min(CN_CAP,stx.today+r.pre);
    return `💰 這一輪賺進 <b>$${r.fin}</b><br><span style="font-size:13px">${r.txt}</span><br><span style="font-size:13px">國文今日 $${newToday} ／ 上限 $${CN_CAP}</span>`;
  }catch(e){
    return `💰 現在連不上錢包，本輪成績已記在星星上，連線後的下一輪會一起算錢`;
  }
}

/* ===== 引擎 ===== */
let mode=null, curLesson=null, idx=0, matchState=null;
let stars=0, maxStars=0, firstTry=0, itemAttempt=0;
let order=[];
const starsFor=n=> n<=1?3 : n===2?2 : 1;
const starStr=n=>'⭐'.repeat(n);
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a;};
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); }
function clozeFromWord(w){ return {t:w.w.split(w.b).join('（＿）'), a:w.b, o:[w.b,...w.o], w:w.w, z:w.z, h:w.h, say:w.say}; }
function clozeItems(L){ return L.words.map(clozeFromWord).concat(L.extra||[]); }
function spotItems(L){ return L.words.map(w=>({t:w.w.split(w.b).join(w.o[0]), wr:w.o[0], co:w.b, w:w.w, h:w.h})); }

/* 語音：點生字唸出來（瀏覽器內建中文語音） */
function speak(t){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='zh-TW'; u.rate=0.8;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('zh-TW'))||speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('zh'));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis' in window) speechSynthesis.getVoices();

  g.innerHTML = SEMS.map((S,si)=>
    `<div class="widebtn" style="background:none;box-shadow:none;padding:6px 2px 0;font-weight:bold;color:var(--sub);grid-column:1/-1">📚 ${S.name}（翰林）</div>`
    + S.list.map((L,i)=>`<button onclick="openLesson(${si},${i})"><b>${L.id}〈${L.title}〉</b><small>${L.author}｜生字 ${L.words.length} 詞</small></button>`).join('')
    + `<button class="widebtn" onclick="startMixed(${si})"><b>🎲 ${S.name} 跨課混合挑戰</b><small>整學期生字隨機 15 題（會考就是這樣混著考）</small></button>`
  ).join('');
}
function openLesson(si,i){
  curLesson=SEMS[si].list[i];
  $('ltitle').textContent=`${curLesson.id}〈${curLesson.title}〉`;
  let m=`
   <button onclick="startMode('cloze')"><span class="emoji">✏️</span><span>選字填空<small>${clozeItems(curLesson).length} 題</small></span></button>
   <button onclick="startMode('spot')"><span class="emoji">🔍</span><span>抓錯字<small>${curLesson.words.length} 題</small></span></button>`;
  if(curLesson.sets) m+=`<button onclick="startMode('match')"><span class="emoji">🔗</span><span>相似字連連看（複習）<small>${curLesson.sets.length} 組｜配對幫記憶，考驗在填空與抓錯字</small></span></button>`;
  if(curLesson.text) m+=`<button onclick="startMode('read')"><span class="emoji">📜</span><span>課文閱讀<small>${curLesson.text.title}</small></span></button>`;
  m+=`<button onclick="startMode('list')"><span class="emoji">📋</span><span>生字表<small>本課官方完整清單（習字練功坊）</small></span></button>`;
  $('lessonMenu').innerHTML=m;
  show('lesson');
}
function backFromPlay(){ if(curLesson) show('lesson'); else show('home'); }

function startMixed(si){
  curLesson=null; mode='cloze';
  const pool=SEMS[si].list.flatMap(L=>clozeItems(L));
  order=shuffle(pool).slice(0,15);
  beginRun(order.length*3); render();
}
function startMode(m){
  mode=m;
  if(m==='cloze'){ order=shuffle(clozeItems(curLesson)); beginRun(order.length*3); }
  if(m==='spot'){ order=shuffle(spotItems(curLesson)); beginRun(order.length*3); }
  if(m==='match'){ order=curLesson.sets.slice(); beginRun(curLesson.sets.reduce((s,x)=>s+x.chars.length,0)*3); }
  if(m==='read'){ renderRead(); show('play'); $('starbar').textContent=''; $('prog').textContent='閱讀'; return; }
  if(m==='list'){ renderList(); show('play'); $('starbar').textContent=''; $('prog').textContent='生字表'; return; }
  render();
}
function beginRun(mx){ idx=0; stars=0; firstTry=0; maxStars=mx; show('play'); updStar(); }
function updStar(){ $('starbar').textContent=`⭐ ${stars} / ${maxStars}`; }
function earn(attempts){ const e=starsFor(attempts); stars+=e; if(attempts<=1)firstTry++; updStar(); return e; }
function render(){
  if(mode==='cloze'){ if(idx>=order.length) return showResult(order.length,'題'); itemAttempt=0; renderCloze(order[idx]); }
  if(mode==='spot'){ if(idx>=order.length) return showResult(order.length,'題'); itemAttempt=0; renderSpot(order[idx]); }
  if(mode==='match'){ if(idx>=order.length) return showResult(order.length,'組'); renderMatch(order[idx]); }
}
function prog(total,unit){ $('prog').textContent = `${idx+1} / ${total} ${unit||'題'}`; }

/* 選字填空 */
function renderCloze(q){
  prog(order.length);
  const opts=shuffle(q.o);
  $('qcard').innerHTML=`
    <div class="qtext">${q.t.replace(/（＿）/g,'<span class="blank">？</span>')}</div>
    <div class="opts">${opts.map(c=>`<button onclick="pickCloze(this,'${c}')">${c}</button>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <button class="nextbtn" id="nx" onclick="idx++;render()">下一題 →</button>`;
}
function pickCloze(btn,c){
  const q=order[idx]; itemAttempt++;
  if(c===q.a){
    btn.classList.add('right');
    document.querySelectorAll('.opts button').forEach(b=>{if(b!==btn)b.classList.add('dim');});
    const e=earn(itemAttempt);
    speak(q.say||q.w);
    fb('good',`✅ 答對了！本題 <span class="starearn">${starStr(e)}</span>　<span style="cursor:pointer" onclick="speak('${q.say||q.w}')">🔊「${q.w}」</span>${q.z?` <span class="zhu">${q.z}</span>`:''}<br>${q.h}`);
  }else{
    btn.classList.add('wrong'); btn.classList.add('dim');
    fb('info',`💡 ${q.h}<br>再試一次！（第一次就對才有 ⭐⭐⭐）`);
  }
}
/* 抓錯字 */
function renderSpot(q){
  prog(order.length);
  const chars=[...q.t];
  $('qcard').innerHTML=`
    <div class="spot-tip">詞語裡有一個字寫錯了（張冠李戴），把它點出來！</div>
    <div class="spot-sent">${chars.map(ch=>`<span class="ch" onclick="pickSpot(this,'${ch===q.wr?'Y':'N'}')">${ch}</span>`).join('')}</div>
    <div class="feedback" id="fb"></div>
    <button class="nextbtn" id="nx" onclick="idx++;render()">下一題 →</button>`;
}
function pickSpot(el,isWrong){
  const q=order[idx];
  if(el.classList.contains('found')||el.classList.contains('fixed'))return;
  itemAttempt++;
  if(isWrong==='Y'){
    el.classList.add('found');
    setTimeout(()=>{ el.textContent=q.co; el.classList.remove('found'); el.classList.add('fixed'); },700);
    const e=earn(itemAttempt);
    fb('good',`✅ 抓到了！本題 <span class="starearn">${starStr(e)}</span>　正確是「${q.w}」<br>💡 ${q.h}`);
  }else{
    el.style.background='var(--red-bg)'; setTimeout(()=>{el.style.background='';},400);
    fb('info',`這個字沒有錯喔，再找找看！<br>💡 提示：${q.h}`);
  }
}
/* 連連看 */
function renderMatch(set){
  prog(order.length,'組');
  matchState={sel:null, remain:set.chars.length, tries:{}};
  const rights=shuffle(set.chars.map(x=>({key:x.c,label:`${x.z}<br><span style="font-size:14px">${x.m.split(x.c).join('◯')}</span>`})));
  $('qcard').innerHTML=`
    <div class="spot-tip">「${set.label}」長得很像！先點左邊的字，再點右邊它的注音＋意思。</div>
    <div class="match-cols">
      <div class="mcol">${set.chars.map(x=>`<button class="charbtn" id="L_${x.c}" onclick="pickLeft('${x.c}')">${x.c}</button>`).join('')}</div>
      <div class="mcol">${rights.map(r=>`<button id="R_${r.key}" onclick="pickRight('${r.key}')">${r.label}</button>`).join('')}</div>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="hinttable" id="ht"></div>
    <button class="nextbtn" id="nx" onclick="idx++;render()">下一組 →</button>`;
}
function pickLeft(c){
  if($('L_'+c).classList.contains('done'))return;
  document.querySelectorAll('.mcol .sel').forEach(b=>b.classList.remove('sel'));
  matchState.sel=c; $('L_'+c).classList.add('sel');
}
function pickRight(key){
  if(!matchState.sel){ fb('info','先點左邊的一個字，再點右邊的答案喔！'); return; }
  const R=$('R_'+key), L=$('L_'+matchState.sel), sel=matchState.sel;
  matchState.tries[sel]=(matchState.tries[sel]||0)+1;
  if(key===sel){
    const info=order[idx].chars.find(x=>x.c===sel);
    R.classList.add('done'); L.classList.add('done'); L.classList.remove('sel');
    R.innerHTML=`${info.z}<br><span style="font-size:14px">${info.m}</span>`;
    speak(info.u.split('、')[0]);
    matchState.remain--; matchState.sel=null;
    const e=earn(matchState.tries[sel]);
    fb('good',`✅ 配對成功 <span class="starearn">${starStr(e)}</span>　🔊「${info.u.split('、')[0]}」`);
    if(matchState.remain===0){
      const set=order[idx];
      const ht=$('ht'); ht.classList.add('show');
      ht.innerHTML='<b>記憶小撇步：</b><br>'+set.chars.map(x=>`「${x.c}」${x.h}（${x.u}）`).join('<br>');
      $('nx').classList.add('show');
    }
  }else{
    R.classList.add('err'); setTimeout(()=>R.classList.remove('err'),400);
    const info=order[idx].chars.find(x=>x.c===sel);
    fb('info',`💡 想想「${sel}」的部首：${info.h}`);
  }
}
/* 課文閱讀 */
function renderRead(){
  const T=curLesson.text;
  $('qcard').innerHTML=`<div class="readtext">`+
    T.parts.map(p=>`<h3>${p.h}</h3>`+p.lines.map(l=>`<p>${l}</p>`).join('')).join('')+
    `</div><div class="readnote">古典詩文為文化公共財。白話課文（琦君、梁實秋、席慕蓉等作家作品）仍在著作權期間，請翻課本閱讀。</div>`;
}
/* 生字表（點生字會唸出來） */
function renderList(){
  $('qcard').innerHTML=`<div class="spot-tip">🔊 點一下生字，會唸給你聽</div><table class="wordtable">`+
    curLesson.words.map(w=>`<tr><td class="w" style="cursor:pointer" onclick="speak('${w.say||w.w}')">🔊 ${w.w}</td><td><div class="z">${w.z}</div><div class="h">${w.h}</div></td></tr>`).join('')+
    `</table><div class="readnote">來源：本課「習字練功坊」官方習寫字詞清單，一字不漏。</div>`;
}
/* 共用 */
function fb(type,html){
  const el=$('fb'); el.className='feedback show '+(type==='good'?'good':'info'); el.innerHTML=html;
  if(type==='good' && (mode==='cloze'||mode==='spot')) $('nx').classList.add('show');
}
function showResult(total,unit){
  $('prog').textContent='完成！';
  const pct=maxStars?Math.round(stars/maxStars*100):100;
  const msg=pct>=90?'太強了，幾乎都是一次就對！':pct>=65?'很不錯！錯過的字再看一下小撇步，下次就是滿星。':'錯的字都看過正解了，明天再玩一次星星會變多！';
  const payable=(mode==='cloze'||mode==='spot');   // 連連看/詞語配對＝複習不計酬
  $('qcard').innerHTML=`
    <div class="result">
      <div class="big">${pct>=90?'🏆':pct>=65?'🎉':'💪'}</div>
      <h2>完成 ${total} ${unit||'題'}</h2>
      <div class="starline">⭐ ${stars} / ${maxStars}</div>
      <p>一次就答對：${firstTry}<br>${msg}</p>
      ${payable?'<div class="feedback good show" id="pay">💰 結算中…</div>':''}
      <button class="nextbtn show" onclick="backFromPlay()">返回</button>
    </div>`;
  if(payable){
    const mName = curLesson? mode : 'mix';
    const u = curLesson? curLesson.id : 'mix';
    cnSettle(mName,u,total).then(html=>{const el=$('pay'); if(el)el.innerHTML=html;});
  }
}
renderHome();
</script>
